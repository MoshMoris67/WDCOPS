name: Worker tick

# Drives background processing (large file imports, reconciliation processing) for the
# Render reserve site — see src/app/api/worker/tick/route.ts and
# docs/test-deployment-render.md. The office machine runs its own tick from a local cron
# job; this workflow only targets the Render URL in the APP_URL secret.
#
# Runs every 5 minutes (GitHub may fire it late) and can also be started by hand from the
# Actions tab (Worker tick > Run workflow). To pause the reserve's ticks, disable the
# workflow in the Actions tab instead of editing this file.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL        the Render app's base URL, e.g. https://wdcops.onrender.com (no trailing slash)
#   WORKER_SECRET  must match the WORKER_SECRET env var set on the Render web service

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the worker tick endpoint
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.APP_URL }}/api/worker/tick" \
            -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}"
